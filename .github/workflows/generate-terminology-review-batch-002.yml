name: Generate Nannul terminology review Batch 002

on:
  push:
    branches:
      - main
    paths:
      - scripts/generate_terminology_review_batch_002.py
      - data/grammatical-terminology-candidates.json
      - data/grammatical-terminology-review.json
      - data/token-occurrences.ndjson
      - data/nurpa.json
      - .github/workflows/generate-terminology-review-batch-002.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Generate Batch 002 contexts
        run: python3 scripts/generate_terminology_review_batch_002.py
      - name: Commit generated review evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reviews/terminology/batch-002-contexts.json reviews/terminology/batch-002-contexts.md reviews/terminology/batch-002-candidate-*.md
          if git diff --cached --quiet; then
            echo 'Batch 002 context packet unchanged.'
            exit 0
          fi
          git commit -m 'Generate Nannul terminology Batch 2 contexts'
          git push origin HEAD:main
