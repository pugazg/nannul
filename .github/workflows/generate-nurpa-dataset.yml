name: Generate Nannul canonical unit dataset

on:
  push:
    branches:
      - main
    paths:
      - scripts/generate_nurpa_dataset.py
      - data/nurpa-index.json
      - structure/identifiers.yml
      - text/tamil/**
      - .github/workflows/generate-nurpa-dataset.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate and validate canonical unit dataset
        run: python3 scripts/generate_nurpa_dataset.py

      - name: Commit generated datasets if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/nurpa.json data/nurpa.ndjson data/nurpa-validation.json
          if git diff --cached --quiet; then
            echo 'Canonical unit datasets are unchanged.'
            exit 0
          fi
          git commit -m 'Generate canonical Nannul unit dataset'
          git push origin HEAD:main
