name: Generate Nannul exact-surface frequency profiles

on:
  push:
    branches:
      - main
    paths:
      - scripts/generate_frequency_profiles.py
      - data/nurpa.json
      - data/token-occurrences.ndjson
      - data/source-heading-index.json
      - data/concordance-validation.json
      - .github/workflows/generate-frequency-profiles.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate and validate frequency profiles
        run: python3 scripts/generate_frequency_profiles.py

      - name: Commit generated frequency outputs if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/frequency-profiles.json \
            data/frequency-tables.json \
            indexes/frequency-profiles.md \
            data/frequency-profiles-validation.json
          if git diff --cached --quiet; then
            echo 'Frequency-profile outputs are unchanged.'
            exit 0
          fi
          git commit -m 'Generate Nannul exact-surface frequency profiles'
          git push origin HEAD:main
