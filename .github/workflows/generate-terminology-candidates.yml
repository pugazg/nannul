name: Generate Nannul terminology candidates

on:
  push:
    branches:
      - main
    paths:
      - scripts/generate_terminology_candidates.py
      - data/nurpa.json
      - data/token-occurrences.ndjson
      - data/source-heading-index.json
      - data/frequency-profiles-validation.json
      - .github/workflows/generate-terminology-candidates.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate and validate unreviewed terminology candidates
        run: python3 scripts/generate_terminology_candidates.py

      - name: Commit generated terminology-candidate outputs if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/grammatical-terminology-candidates.json \
            data/grammatical-terminology-candidates.ndjson \
            data/grammatical-terminology-candidates-validation.json \
            indexes/grammatical-terminology-review-queue.md
          if git diff --cached --quiet; then
            echo 'Terminology candidate outputs are unchanged.'
            exit 0
          fi
          git commit -m 'Generate Nannul terminology candidate queue'
          git push origin HEAD:main
